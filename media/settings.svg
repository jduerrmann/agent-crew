<svg xmlns="http://www.w3.org/2000/svg" width="860" height="488" viewBox="0 0 860 488"><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif}
.run .la{animation:st .5s steps(1) infinite}.run .lb{animation:st .5s steps(1) infinite -.25s}
.run .bd{animation:bob .5s steps(1) infinite -.125s}.run g{transform-box:fill-box}
@keyframes st{50%{transform:translateY(-1px)}}@keyframes bob{50%{transform:translateY(1px)}}
.c-careful.run .it{transform-origin:100% 100%;animation:twist .5s ease-in-out infinite}@keyframes twist{50%{transform:rotate(-35deg)}}
.c-explore.run .it{transform-origin:50% 100%;animation:fence .5s ease-in-out infinite}@keyframes fence{50%{transform:rotate(25deg)}}
.c-light.run .la{animation-duration:.25s}.c-light.run .lb{animation-duration:.25s;animation-delay:-.125s}
.c-light.run .flag{transform-origin:0 50%;animation:wave .25s steps(1) infinite}@keyframes wave{50%{transform:skewY(-12deg) scaleX(.85)}}
.live{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.3}}
.fresh{animation:fr 1s ease-in-out infinite}@keyframes fr{50%{opacity:.4}}
.grow{animation:grow 3s ease-in-out infinite alternate}@keyframes grow{from{transform:scaleX(.55)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="860" height="488" rx="16" fill="#1b1b1a"/><rect x="18" y="16" width="824" height="250" rx="10" fill="none" stroke="#3a3a38" stroke-width="1.2"/><text x="32" y="40" font-size="12.5" fill="#a8a8a4" font-weight="600">Sections</text><text x="32" y="68" font-size="12.5" fill="#ececec" font-weight="600">Usage</text><text x="32" y="84" font-size="11" fill="#7d7d79" >Context and limits at the top of the panel; the Usage group picks which</text><rect x="764" y="56" width="64" height="24" rx="6" fill="#D97757"/><text x="796" y="72" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">● On</text><text x="32" y="110" font-size="12.5" fill="#ececec" font-weight="600">Cost</text><text x="32" y="126" font-size="11" fill="#7d7d79" >Main chat and subagents apart, with tokens and a total</text><rect x="764" y="98" width="64" height="24" rx="6" fill="#2c2c2b"/><text x="796" y="114" font-size="11.5" fill="#ececec" text-anchor="middle" font-weight="600">○ Off</text><text x="32" y="152" font-size="12.5" fill="#ececec" font-weight="600">Subagents</text><text x="32" y="168" font-size="11" fill="#7d7d79" >Running and finished subagents, with details</text><rect x="764" y="140" width="64" height="24" rx="6" fill="#D97757"/><text x="796" y="156" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">● On</text><text x="32" y="194" font-size="12.5" fill="#ececec" font-weight="600">Timeline</text><text x="32" y="210" font-size="11" fill="#7d7d79" >When each agent ran, on one shared axis</text><rect x="764" y="182" width="64" height="24" rx="6" fill="#D97757"/><text x="796" y="198" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">● On</text><text x="32" y="236" font-size="12.5" fill="#ececec" font-weight="600">Files</text><text x="32" y="252" font-size="11" fill="#7d7d79" >Files read, changed and committed, as a tree with diffs</text><rect x="764" y="224" width="64" height="24" rx="6" fill="#D97757"/><text x="796" y="240" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">● On</text><rect x="18" y="280" width="824" height="166" rx="10" fill="none" stroke="#3a3a38" stroke-width="1.2"/><text x="32" y="304" font-size="12.5" fill="#a8a8a4" font-weight="600">Usage</text><text x="32" y="332" font-size="12.5" fill="#ececec" font-weight="600">Context</text><text x="32" y="348" font-size="11" fill="#7d7d79" >How full the session’s context window is</text><rect x="764" y="320" width="64" height="24" rx="6" fill="#D97757"/><text x="796" y="336" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">● On</text><text x="32" y="374" font-size="12.5" fill="#ececec" font-weight="600">5-hour limit</text><text x="32" y="390" font-size="11" fill="#7d7d79" >Use so far and time until it resets</text><rect x="764" y="362" width="64" height="24" rx="6" fill="#D97757"/><text x="796" y="378" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">● On</text><text x="32" y="416" font-size="12.5" fill="#ececec" font-weight="600">Weekly limit</text><text x="32" y="432" font-size="11" fill="#7d7d79" >Use so far and time until it resets</text><rect x="764" y="404" width="64" height="24" rx="6" fill="#2c2c2b"/><text x="796" y="420" font-size="11.5" fill="#ececec" text-anchor="middle" font-weight="600">○ Off</text><text x="32" y="472" font-size="11" fill="#7d7d79" >The same values as /config. Changes apply at once. General and Notifications follow below.</text></svg>