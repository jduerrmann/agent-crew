<svg xmlns="http://www.w3.org/2000/svg" width="860" height="438" viewBox="0 0 860 438"><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif}
.run .la{animation:st .5s steps(1) infinite}.run .lb{animation:st .5s steps(1) infinite -.25s}
.run .bd{animation:bob .5s steps(1) infinite -.125s}.run g{transform-box:fill-box}
@keyframes st{50%{transform:translateY(-1px)}}@keyframes bob{50%{transform:translateY(1px)}}
.c-careful.run .it{transform-origin:100% 100%;animation:twist .5s ease-in-out infinite}@keyframes twist{50%{transform:rotate(-35deg)}}
.c-explore.run .it{transform-origin:50% 100%;animation:fence .5s ease-in-out infinite}@keyframes fence{50%{transform:rotate(25deg)}}
.c-light.run .la{animation-duration:.25s}.c-light.run .lb{animation-duration:.25s;animation-delay:-.125s}
.c-light.run .flag{transform-origin:0 50%;animation:wave .25s steps(1) infinite}@keyframes wave{50%{transform:skewY(-12deg) scaleX(.85)}}
.live{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.3}}
.fresh{animation:fr 1s ease-in-out infinite}@keyframes fr{50%{opacity:.4}}
.grow{animation:grow 3s ease-in-out infinite alternate}@keyframes grow{from{transform:scaleX(.55)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="860" height="438" rx="16" fill="#1b1b1a"/><rect x="18" y="16" width="824" height="196" rx="10" fill="none" stroke="#3a3a38" stroke-width="1.2"/><text x="32" y="40" font-size="12.5" fill="#a8a8a4" font-weight="600">Display</text><text x="32" y="68" font-size="12.5" fill="#ececec" font-weight="600">Usage</text><text x="32" y="84" font-size="11" fill="#7d7d79" >Context, 5-hour and weekly limit at the top of the panel</text><rect x="764" y="56" width="64" height="24" rx="6" fill="#D97757"/><text x="796" y="72" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">● On</text><text x="32" y="110" font-size="12.5" fill="#ececec" font-weight="600">Timeline</text><text x="32" y="126" font-size="11" fill="#7d7d79" >When each agent ran, on one shared axis</text><rect x="764" y="98" width="64" height="24" rx="6" fill="#D97757"/><text x="796" y="114" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">● On</text><text x="32" y="152" font-size="12.5" fill="#ececec" font-weight="600">Language</text><text x="32" y="168" font-size="11" fill="#7d7d79" >Automatic follows Claude Code’s language, then the system</text><rect x="32" y="178" width="93" height="24" rx="6" fill="#D97757"/><text x="78.5" y="194" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">✓ Automatic</text><rect x="133" y="178" width="71" height="24" rx="6" fill="#2c2c2b"/><text x="168.5" y="194" font-size="11.5" fill="#ececec" text-anchor="middle" font-weight="600">Deutsch</text><rect x="212" y="178" width="71" height="24" rx="6" fill="#2c2c2b"/><text x="247.5" y="194" font-size="11.5" fill="#ececec" text-anchor="middle" font-weight="600">English</text><rect x="18" y="226" width="824" height="176" rx="10" fill="none" stroke="#3a3a38" stroke-width="1.2"/><text x="32" y="250" font-size="12.5" fill="#a8a8a4" font-weight="600">Notifications</text><text x="32" y="278" font-size="12.5" fill="#ececec" font-weight="600">Agent finished</text><text x="32" y="294" font-size="11" fill="#7d7d79" >When a notice comes as a subagent ends</text><rect x="32" y="304" width="43" height="24" rx="6" fill="#2c2c2b"/><text x="53.5" y="320" font-size="11.5" fill="#ececec" text-anchor="middle" font-weight="600">Off</text><rect x="83" y="304" width="113" height="24" rx="6" fill="#2c2c2b"/><text x="139.5" y="320" font-size="11.5" fill="#ececec" text-anchor="middle" font-weight="600">Failures only</text><rect x="204" y="304" width="100" height="24" rx="6" fill="#D97757"/><text x="254" y="320" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">✓ Background</text><rect x="312" y="304" width="43" height="24" rx="6" fill="#2c2c2b"/><text x="333.5" y="320" font-size="11.5" fill="#ececec" text-anchor="middle" font-weight="600">All</text><text x="32" y="350" font-size="12.5" fill="#ececec" font-weight="600">Conflict warning</text><text x="32" y="366" font-size="11" fill="#7d7d79" >When two agents change the same file within 10 minutes</text><rect x="764" y="338" width="64" height="24" rx="6" fill="#D97757"/><text x="796" y="354" font-size="11.5" fill="#fff" text-anchor="middle" font-weight="600">● On</text><text x="32" y="422" font-size="11" fill="#7d7d79" >The same values as /config. Changes apply at once.</text></svg>