<svg xmlns="http://www.w3.org/2000/svg" width="860" height="170" viewBox="0 0 860 170"><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif}
.run .la{animation:st .5s steps(1) infinite}.run .lb{animation:st .5s steps(1) infinite -.25s}
.run .bd{animation:bob .5s steps(1) infinite -.125s}.run g{transform-box:fill-box}
@keyframes st{50%{transform:translateY(-1px)}}@keyframes bob{50%{transform:translateY(1px)}}
.c-careful.run .it{transform-origin:100% 100%;animation:twist .5s ease-in-out infinite}@keyframes twist{50%{transform:rotate(-35deg)}}
.c-explore.run .it{transform-origin:50% 100%;animation:fence .5s ease-in-out infinite}@keyframes fence{50%{transform:rotate(25deg)}}
.c-light.run .la{animation-duration:.25s}.c-light.run .lb{animation-duration:.25s;animation-delay:-.125s}
.c-light.run .flag{transform-origin:0 50%;animation:wave .25s steps(1) infinite}@keyframes wave{50%{transform:skewY(-12deg) scaleX(.85)}}
.live{animation:p 1.6s ease-in-out infinite}@keyframes p{50%{opacity:.3}}
.fresh{animation:fr 1s ease-in-out infinite}@keyframes fr{50%{opacity:.4}}
.grow{animation:grow 3s ease-in-out infinite alternate}@keyframes grow{from{transform:scaleX(.55)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="860" height="170" rx="16" fill="#1b1b1a"/><rect x="18" y="16" width="824" height="92" rx="10" fill="none" stroke="#3a3a38" stroke-width="1.2"/><text x="32" y="38" font-size="12.5" fill="#a8a8a4" font-weight="600">Usage</text><text x="828" y="38" font-size="12" fill="#ececec" text-anchor="end" font-weight="600">/compact</text><circle cx="52" cy="70" r="11" fill="none" stroke="#7d7d79" stroke-opacity=".35" stroke-width="3.5"/><circle cx="52" cy="70" r="11" fill="none" stroke="#378ADD" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="35.248669573277475 69.11503837897544" transform="rotate(-90 52 70)"/><text x="72" y="74" font-size="14"><tspan fill="#ececec" font-weight="600">51%</tspan><tspan fill="#a8a8a4"> context</tspan></text><text x="72" y="91" font-size="11" fill="#7d7d79" >507k / 1.0M</text><circle cx="326.6666666666667" cy="70" r="11" fill="none" stroke="#7d7d79" stroke-opacity=".35" stroke-width="3.5"/><circle cx="326.6666666666667" cy="70" r="11" fill="none" stroke="#BA7517" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="57.365481854549614 69.11503837897544" transform="rotate(-90 326.6666666666667 70)"/><text x="346.6666666666667" y="74" font-size="14"><tspan fill="#ececec" font-weight="600">83%</tspan><tspan fill="#a8a8a4"> 5h</tspan></text><text x="346.6666666666667" y="91" font-size="11" fill="#7d7d79" >resets in 1h 12m</text><circle cx="601.3333333333334" cy="70" r="11" fill="none" stroke="#7d7d79" stroke-opacity=".35" stroke-width="3.5"/><circle cx="601.3333333333334" cy="70" r="11" fill="none" stroke="#378ADD" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="6.911503837897544 69.11503837897544" transform="rotate(-90 601.3333333333334 70)"/><text x="621.3333333333334" y="74" font-size="14"><tspan fill="#ececec" font-weight="600">10%</tspan><tspan fill="#a8a8a4"> week</tspan></text><text x="621.3333333333334" y="91" font-size="11" fill="#7d7d79" >resets in 3d 6h</text><rect x="552" y="122" width="290" height="34" rx="8" fill="#262625" stroke="#BA7517" stroke-opacity=".6"/><text x="566" y="144" font-size="12" fill="#ececec" >⚠  5h limit at 83 % (resets in 1h 12m)</text></svg>